plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+26.3"
group = project.maven_group
base { archivesName = project.archives_base_name }

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

def extraResources = findProperty('extraResources')
if (extraResources) {
	sourceSets.main.resources.srcDir extraResources
}

processResources {
	def version = project.mod_version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

loom {
	decompilerOptions.vineflower {
		memory = 2200
		maxThreads = 1
	}
}

tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xmaxerrs', '3000'] }
